# Keeps the FighterBase-Dev Supabase project from being auto-paused for inactivity.
# Sends a few harmless requests every 2 days using the public publishable key (the same one the test page uses).
# Fails with a plain message if the project cannot be reached (for example it has been paused).
name: keepalive
on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          U=https://xwuqyzjdyfypyglkvpnp.supabase.co
          K=sb_publishable_UE7Dwez6cWHaU0jRwxYQJg_lYFkD-6g
          a=$(curl -sS -m 20 -o /dev/null -w "%{http_code}" "$U/auth/v1/health" -H "apikey: $K" || echo "unreachable")
          r=$(curl -sS -m 20 -o /dev/null -w "%{http_code}" "$U/rest/v1/" -H "apikey: $K" || echo "unreachable")
          c=$(curl -sS -m 20 -o /dev/null -w "%{http_code}" "$U/rest/v1/clubs?select=id&limit=1" -H "apikey: $K" -H "Authorization: Bearer $K" || echo "unreachable")
          echo "auth health: $a | rest root: $r | clubs query: $c"
          if [ "$a" != "200" ] && [ "$r" != "200" ] && [ "$c" != "200" ]; then
            echo "::error title=Supabase not reachable::auth=$a rest=$r clubs=$c. The FighterBase-Dev project may be paused or removed. Open the Supabase dashboard and restore it."
            exit 1
          fi
